function applyTheme() {
  document.documentElement.dataset.theme = settings.theme;
  if (settings.calm) document.documentElement.dataset.calm = '1'; else delete document.documentElement.dataset.calm;
  if (settings.poison) document.documentElement.dataset.poison = '1'; else delete document.documentElement.dataset.poison;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', theme().meta);
  nudgeNumbers();
}
// Alchemy's serif digits sit differently inside their line box on every phone (some fonts have old-style figures that hang low).
// So measure the real ink of "40" in the font this phone actually uses and move the number so its ink is centred in the panel.
let nudgeKey = '';
function nudgeNumbers() {
  const root = document.documentElement;
  if (settings.theme !== 'alchemy') { root.style.removeProperty('--nd'); nudgeKey = ''; return; }
  try {
    const fam = getComputedStyle(root).getPropertyValue('--num').trim() || 'serif';
    if (nudgeKey === fam) return;
    const g = document.createElement('canvas').getContext('2d'); g.font = '400 100px ' + fam;
    const m = g.measureText('40'), dy = ((m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) - (m.fontBoundingBoxAscent - m.fontBoundingBoxDescent)) / 2 / 100;
    if (isFinite(dy) && Math.abs(dy) < .4) { root.style.setProperty('--nd', dy.toFixed(4)); nudgeKey = fam; }
  } catch (e) {}
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { nudgeKey = ''; nudgeNumbers(); });

const setEl = document.getElementById('settings'), themeSel = document.getElementById('themeSel'), soundBtn = document.getElementById('soundBtn');
themeSel.innerHTML = Object.keys(THEMES).map(k => `<option value="${k}">${THEMES[k].label}</option>`).join('');
const partnerBtn = document.getElementById('partnerBtn'), calmBtn = document.getElementById('calmBtn'), poisonBtn = document.getElementById('poisonBtn');
function syncSettingsUI() { document.querySelectorAll('#cmdSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === settings.cmdMode))); document.querySelectorAll('#playersSeg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.n === settings.players))); themeSel.value = settings.theme; soundBtn.setAttribute('aria-checked', String(settings.sound)); partnerBtn.setAttribute('aria-checked', String(settings.partners)); calmBtn.setAttribute('aria-checked', String(settings.calm)); poisonBtn.setAttribute('aria-checked', String(settings.poison)); }
let setOpenedAt = 0;
function openSettings() { syncSettingsUI(); setEl.classList.add('open'); setEl.setAttribute('aria-hidden', 'false'); setOpenedAt = Date.now(); }
function closeSettings() { setEl.classList.remove('open'); setEl.setAttribute('aria-hidden', 'true'); }
themeSel.addEventListener('change', () => { settings.theme = themeSel.value; saveSettings(); applyTheme(); render(); });
soundBtn.addEventListener('click', () => {
  settings.sound = !settings.sound; saveSettings(); syncSettingsUI();
  if (settings.sound) sfx('up');                         // a little blip to show it is on (we are inside a touch, so audio can start)
});
partnerBtn.addEventListener('click', () => {
  settings.partners = !settings.partners; saveSettings(); syncSettingsUI();
  if (!settings.partners) { s.partner = COLORS.map(() => false); COLORS.forEach((_, i) => COLORS.forEach((_, j) => { s.sel[i][j] = 0; })); save(); }   // switching it off puts everyone back to a single commander
  render();
});
poisonBtn.addEventListener('click', () => {
  settings.poison = !settings.poison; saveSettings(); syncSettingsUI(); applyTheme();
  if (!settings.poison && s.p) { s.p = false; save(); }   // leave poison mode when the option is switched off (the counts are kept)
  render();
});
const askEl = document.getElementById('confirm');
let askN = 0;
const gameTouched = () => s.life.some(v => v !== START) || s.cmd.some(r => r.some(q => q.some(v => v))) || s.poison.some(v => v);
function setPlayers(n) {       // a different table size is a new game: the old numbers would make no sense
  settings.players = n; saveSettings();
  const c = s.c; s = fresh(); s.c = c; winner = null; save();
  prevDead = null; prevAlive = COLORS.length; champ = -1; champShow = false; clearTimeout(champTimer);   // no death/champion sounds for the change itself
  skipDeltas = true; wipe(); syncSettingsUI(); render(); deal();
}
const closeAsk = () => { askEl.classList.remove('open'); askEl.setAttribute('aria-hidden', 'true'); };
document.getElementById('playersSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || +b.dataset.n === settings.players) return;
  askN = +b.dataset.n;
  if (!gameTouched()) { setPlayers(askN); return; }
  document.getElementById('askTxt').textContent = 'Restart with ' + askN + ' players?';
  askEl.classList.add('open'); askEl.setAttribute('aria-hidden', 'false');
});
document.getElementById('askYes').addEventListener('click', () => { closeAsk(); setPlayers(askN); });
document.getElementById('askNo').addEventListener('click', closeAsk);
askEl.addEventListener('click', e => { if (e.target === askEl) closeAsk(); });
document.getElementById('cmdSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.m === settings.cmdMode) return;
  settings.cmdMode = b.dataset.m; saveSettings(); syncSettingsUI(); render();
});
calmBtn.addEventListener('click', () => { settings.calm = !settings.calm; saveSettings(); syncSettingsUI(); applyTheme(); });
document.getElementById('closeSet').addEventListener('click', closeSettings);
setEl.addEventListener('click', e => { if (e.target === setEl && Date.now() - setOpenedAt > 400) closeSettings(); });


// ---------- history sheet: the last actions, with undo; hold the button inside to reset ----------
const histEl = document.getElementById('history'), histList = document.getElementById('histList'), undoBtn = document.getElementById('undoBtn'), hResetBtn = document.getElementById('hReset');
let histOpenedAt = 0;
const minus = n => (n < 0 ? '−' : '+') + Math.abs(n);
function ago(t) { const sec = Math.max(0, Math.round((Date.now() - t) / 1000)); return sec < 5 ? 'now' : sec < 60 ? sec + 's' : Math.floor(sec / 60) + 'm'; }
function dotFor(i) { return `<span class="dot" style="background:${PAL[i].acc};color:${PAL[i].acc}"></span>`; }
function renderHistory() {
  const rows = s.hist.slice().reverse().map((e, n) => {
    const skull = e.died && e.died.length ? `<span class="hskull" title="eliminated">&#9760;</span>` : '';
    const txt = e.kind === 'life'
      ? `${dotFor(e.i)} life <b>${minus(e.d)}</b> &rarr; ${e.v}${skull}`
      : e.kind === 'poison'
      ? `${dotFor(e.i)} poison <b>${minus(e.d)}</b> &rarr; ${e.v}${skull}`
      : `${dotFor(e.i)} commander <b>${e.d > 0 ? '+' : '−'}${Math.abs(e.d)}</b> from ${dotFor(e.j)} &rarr; ${e.v}${skull}`;
    return `<div class="hrow${n === 0 ? ' newest' : ''}"><span class="txt">${txt}</span><span class="tm">${ago(e.t)}</span></div>`;
  });
  histList.innerHTML = rows.length ? rows.join('') : '<div class="hist-empty">No changes yet</div>';
  undoBtn.disabled = !s.hist.length;
}
function openHistory() {
  if (spinning) return;
  renderHistory(); histEl.classList.add('open'); histEl.setAttribute('aria-hidden', 'false'); histOpenedAt = Date.now();
}
function closeHistory() { histEl.classList.remove('open'); histEl.setAttribute('aria-hidden', 'true'); stopHReset(); }
function undoLast() {
  const e = s.hist.pop(); if (!e) return;
  s.life = e.before.life.slice(); s.cmd = e.before.cmd.map(r => r.map(q => q.slice())); s.poison = (e.before.poison || s.poison.map(() => 0)).slice();
  winner = null; sfx('cmdUndo'); save(); render(); renderHistory();
}
undoBtn.addEventListener('click', () => { audio(); undoLast(); });
document.getElementById('closeHist').addEventListener('click', closeHistory);
histEl.addEventListener('click', e => { if (e.target === histEl && Date.now() - histOpenedAt > 400) closeHistory(); });
let hResetTimer = null;
function stopHReset() { clearTimeout(hResetTimer); hResetTimer = null; hResetBtn.classList.remove('holding'); }
hResetBtn.addEventListener('pointerdown', () => {
  audio(); hResetBtn.classList.add('holding'); clearTimeout(hResetTimer);
  hResetTimer = setTimeout(() => { hResetTimer = null; hResetBtn.classList.remove('holding'); closeHistory(); doReset(); }, RESET_MS);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => hResetBtn.addEventListener(t, stopHReset));
hResetBtn.addEventListener('contextmenu', e => e.preventDefault());

// hold C (0.6s) = settings; a normal tap still toggles commander damage
const cBtn = document.getElementById('cbtn');
let cTimer = null, cLong = false;
let cShow = null;
const cStop = () => { clearTimeout(cShow); cShow = null; cBtn.classList.remove('holding'); };
cBtn.addEventListener('pointerdown', () => {
  cLong = false; clearTimeout(cTimer); cStop();
  cShow = setTimeout(() => { cShow = null; cBtn.classList.add('holding'); }, 150);   // the fill ring starts after 150ms, so a quick tap shows nothing
  cTimer = setTimeout(() => { cTimer = null; cLong = true; cStop(); if (navigator.vibrate) navigator.vibrate(15); openSettings(); }, 600);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cBtn.addEventListener(t, () => { clearTimeout(cTimer); cTimer = null; cStop(); }));

// Keep the screen on while the app is open (Screen Wake Lock). It is released by the browser whenever the app
// goes to the background, so ask for it again when we come back. Needs HTTPS; quietly does nothing if unsupported.
let wakeLock = null;
async function keepAwake() {
  try {
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || wakeLock) return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', keepAwake);
document.addEventListener('pointerdown', keepAwake, { passive:true });   // some browsers only allow it after a touch
keepAwake();

// a few leaves for the Enchanted Forest theme (hidden by CSS in the other themes)
(() => {
  const box = document.getElementById('leaves'), r = (a, b) => a + Math.random() * (b - a);
  for (let n = 0; n < 7; n++) {
    const el = document.createElement('i'), dur = r(20, 34);
    el.style.cssText = `--x:${r(2, 96).toFixed(1)}%;--dur:${dur.toFixed(1)}s;--delay:${(-r(0, dur)).toFixed(1)}s;--sc:${r(.8, 1.35).toFixed(2)};--sway:${r(-70, 70).toFixed(0)}px`;
    box.appendChild(el);
  }
  for (let n = 0; n < 14; n++) {      // fireflies
    const el = document.createElement('b'), dur = r(12, 24);
    el.style.cssText = `--x:${r(3, 96).toFixed(1)}%;--y:${r(6, 92).toFixed(1)}%;--dur:${dur.toFixed(1)}s;--delay:${(-r(0, dur)).toFixed(1)}s;--blink:${r(2.6, 5.2).toFixed(1)}s;--dx:${r(-60, 60).toFixed(0)}px;--dy:${r(-40, 40).toFixed(0)}px`;
    box.appendChild(el);
  }
})();
applyTheme();
render();
deal();
</script>

if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }</script>
